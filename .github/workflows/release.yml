name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  release:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Assemble and zip Blinker.app
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          APP_VERSION="${VERSION#v}"
          Scripts/package-app.sh .build/apple/Products/Release/Blinker \
            "$APP_VERSION" "${GITHUB_RUN_NUMBER}" "Blinker.app"
          ditto -c -k --keepParent Blinker.app "Blinker-${VERSION}-universal.zip"
          shasum -a 256 "Blinker-${VERSION}-universal.zip" > SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Blinker-*-universal.zip
            SHA256SUMS.txt
          generate_release_notes: true
