name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: macos-26
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      make_latest: ${{ steps.version.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 Scripts/validate-release.py tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, checks]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Assemble Blinker.app and build DMG
        env:
          VERSION: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.version.outputs.app_version }}
          CODESIGN_IDENTITY: "-"
          BLINKER_BUNDLE_ID: com.ygnstudio.Blinker
        run: |
          RELEASE_BIN_DIR="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          Scripts/package-app.sh "$RELEASE_BIN_DIR/Blinker" \
            "$APP_VERSION" "${GITHUB_RUN_NUMBER}" "Blinker.app"
          mkdir -p dist
          cp -R Blinker.app dist/
          ln -s /Applications dist/Applications
          hdiutil create -volname "Blinker ${VERSION}" -srcfolder dist \
            -ov -format UDZO "Blinker-${VERSION}.dmg"

      - name: Verify final DMG and write checksum
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python3 Scripts/validate-release.py dmg "Blinker-${VERSION}.dmg" \
            --tag "$VERSION" --build "$GITHUB_RUN_NUMBER" --checksums SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Upload to GitHub Release
        # Pinned to the commit that `v2` pointed at (supply-chain hardening).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.make_latest }}
          fail_on_unmatched_files: true
          files: |
            Blinker-*.dmg
            SHA256SUMS.txt
          body: |
            ## 安装

            稳定版推荐通过 Homebrew 安装：`brew install --cask ygnstudio/ygn/blinker`。
            预发布版请下载本页 DMG；Homebrew 稳定通道不会自动安装 beta。

            1. 也可下载下方的 `Blinker-v*.dmg`，将 `Blinker.app` 拖入“应用程序”。
            2. 本应用使用 ad-hoc 签名，未使用 Developer ID，也未经过 Apple 公证。首次启动可能被 Gatekeeper 拦截。
            3. 确认下载来源后，在“系统设置 → 隐私与安全性”中查看提示，选择“仍要打开”；系统或组织策略可能不允许此操作。
            4. 启动后按提示授予辅助功能权限；窗口缩略图另需屏幕录制权限。

            安装方式不会绕过 Gatekeeper。详见 [Apple 的打开应用说明](https://support.apple.com/102445)。
          generate_release_notes: true
