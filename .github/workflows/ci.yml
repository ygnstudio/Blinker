name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test

  lint:
    runs-on: macos-26
    env:
      SWIFTFORMAT_VERSION: 0.63.0
      SWIFTLINT_VERSION: 0.62.2
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned SwiftLint & SwiftFormat
        run: |
          curl -LsS "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o /tmp/swiftformat.zip
          curl -LsS "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" -o /tmp/swiftlint.zip
          mkdir -p /usr/local/bin
          unzip -oq /tmp/swiftformat.zip -d /tmp/swiftformat
          unzip -oq /tmp/swiftlint.zip -d /tmp/swiftlint
          install /tmp/swiftformat/swiftformat /usr/local/bin/swiftformat
          install /tmp/swiftlint/swiftlint /usr/local/bin/swiftlint
          swiftlint version && swiftformat --version

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: SwiftFormat (check only)
        run: swiftformat --lint .
