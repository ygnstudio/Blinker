# Rules: enabled by default, disabled by exception.
opt_in_rules:
  - empty_count
  - explicit_init
  - closure_spacing
  - first_where
  - sorted_imports

line_length:
  warning: 110
  error: 130

type_body_length:
  warning: 300

file_length:
  warning: 500

identifier_name:
  min_length: 3
  excluded:
    - id
    - pid
